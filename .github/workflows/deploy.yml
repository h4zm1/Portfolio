name: Deploy Portfolio

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: portfolio
      url: https://hazmimosbah.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular SSR
        run: npm run build

      # copy built files (dist folder) to EC2
      - name: Copy build to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "dist/portfolio/"
          target: "/home/ubuntu/apps/portfolio"
          # remove old files before copying new files
          rm: true

      # copy package.json for future package changes
      - name: Copy package.json to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "package.json,package-lock.json"
          target: "/home/ubuntu/apps/portfolio"

      # SSH in and restart the service
      - name: Restart Portfolio service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # install prod dependencies
            cd /home/ubuntu/apps/portfolio
            npm ci --omit=dev
            
            # restart systemd
            sudo systemctl restart portfolio
